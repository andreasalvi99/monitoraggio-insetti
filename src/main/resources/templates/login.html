<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accesso - Monitoraggio insetti</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
  </head>
  <body class="bg-body-tertiary">
    <main class="container py-5" style="max-width: 480px;">
      <h1 class="h3 mb-4">Accesso operatori</h1>

      <p class="alert alert-danger" th:if="${param.error}" role="alert">Email o password non valide</p>
      <p class="alert alert-success" th:if="${param.logout}">Disconnessione effettuata</p>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input
            class="form-control"
            id="email"
            type="email"
            name="username"
            autocomplete="username"
            required
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input
            class="form-control"
            id="password"
            type="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button class="btn btn-primary w-100" type="submit">Accedi</button>
      </form>
    </main>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
