<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Segnalazioni - Monitoraggio insetti</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
    <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
      <h1 class="mb-6 text-2xl font-semibold tracking-tight">Segnalazioni</h1>

      <p class="rounded-lg border border-blue-200 bg-blue-50 p-4 text-blue-900" th:if="${#lists.isEmpty(reports)}">Non ci sono segnalazioni</p>

      <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="w-full text-left text-sm" th:unless="${#lists.isEmpty(reports)}">
          <thead class="border-b border-slate-200 bg-slate-100 text-slate-700">
            <tr>
              <th class="px-4 py-3 font-semibold" scope="col">ID</th>
              <th class="px-4 py-3 font-semibold" scope="col">Stato</th>
              <th class="px-4 py-3 font-semibold" scope="col">Data</th>
              <th class="px-4 py-3 font-semibold" scope="col">Descrizione</th>
            </tr>
          </thead>
          <tbody>
            <tr class="border-b border-slate-100 last:border-b-0 odd:bg-white even:bg-slate-50 hover:bg-blue-50" th:each="report : ${reports}">
              <td class="px-4 py-3 align-top" th:text="${report.id}"></td>
              <td class="px-4 py-3 align-top" th:text="${report.status}"></td>
              <td class="whitespace-nowrap px-4 py-3 align-top"
                th:text="${#temporals.format(report.reportDate, 'dd/MM/yyyy HH:mm')}"
              ></td>
              <td class="px-4 py-3 align-top" th:text="${report.description ?: '-'}"></td>
            </tr>
          </tbody>
        </table>
      </div>

      <form class="mt-6" th:action="@{/logout}" method="post">
        <button class="cursor-pointer rounded-lg border border-slate-300 bg-white px-4 py-2 font-medium text-slate-700 hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700" type="submit">Esci</button>
      </form>
    </main>
  </body>
</html>
