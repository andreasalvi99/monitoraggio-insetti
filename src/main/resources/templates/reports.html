<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Segnalazioni - Monitoraggio insetti</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
  </head>
  <body class="bg-body-tertiary">
    <main class="container py-4">
      <h1 class="h3 mb-4">Segnalazioni</h1>

      <p class="alert alert-info" th:if="${#lists.isEmpty(reports)}">Non ci sono segnalazioni</p>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle" th:unless="${#lists.isEmpty(reports)}">
          <thead class="table-light">
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Stato</th>
              <th scope="col">Data</th>
              <th scope="col">Descrizione</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="report : ${reports}">
              <td th:text="${report.id}"></td>
              <td th:text="${report.status}"></td>
              <td
                th:text="${#temporals.format(report.reportDate, 'dd/MM/yyyy HH:mm')}"
              ></td>
              <td th:text="${report.description ?: '-'}"></td>
            </tr>
          </tbody>
        </table>
      </div>

      <form class="mt-3" th:action="@{/logout}" method="post">
        <button class="btn btn-outline-secondary" type="submit">Esci</button>
      </form>
    </main>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
