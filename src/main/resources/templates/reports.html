<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Segnalazioni - Monitoraggio insetti</title>
  </head>
  <body>
    <main>
      <h1>Segnalazioni</h1>

      <p th:if="${#lists.isEmpty(reports)}">Non ci sono segnalazioni</p>

      <table th:unless="${#lists.isEmpty(reports)}">
        <thead>
          <tr>
            <td scope="col">ID</td>
            <td scope="col">Stato</td>
            <td scope="col">Data</td>
            <td scope="col">Descrizione</td>
          </tr>
        </thead>
        <tbody>
          <tr th:each="report : ${reports}">
            <td th:text="${report.id}"></td>
            <td th:text="${report.status}"></td>
            <td
              th:text="${#temporals.format(report.reportDate, 'dd/MM/yyyy HH:mm')}"
            ></td>
            <td th:text="${report.description ?: '-'}"></td>
          </tr>
        </tbody>
      </table>

      <form th:action="@{/logout}" method="post">
        <button type="submit">Esci</button>
      </form>
    </main>
  </body>
</html>
